[project]
name = "govai-workers"
version = "0.1.0"
description = "GOVAI veri toplama, doküman ayrıştırma ve kural çıkarım worker'ları"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pypdf>=4.2",
    "pika>=1.3",
    "apscheduler>=3.10",
    "croniter>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.3",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
govai-collector = "govai_workers.collector.runner:main"
govai-parser = "govai_workers.parser.runner:main"
govai-scheduler = "govai_workers.scheduler:main"
govai-scoring = "govai_workers.scoring.runner:main"
govai-health = "govai_workers.health:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["govai_workers*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
