name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: .NET derleme ve testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOT: Burada bilerek `actions/setup-dotnet` KULLANILMIYOR.
      # 17.08.2026'da o action'ın tarball'ı codeload.github.com üzerinden ısrarla
      # 429 (Too Many Requests) döndürdü ve iş, ortam kurulumunda hiç başlayamadan
      # düştü — aynı adımda actions/checkout sorunsuz indiği için sorun o tek
      # artefakta özgüydü. Microsoft'un resmî kurulum betiği aynı işi yapar ve
      # action indirmeye bağımlı değildir. "Sadeleştirme" amacıyla setup-dotnet'e
      # geri dönmeden önce bu geçmişi bilin.
      - name: .NET SDK kur (global.json sürümü)
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Sürümü doğrula
        run: dotnet --info | head -20

      - name: NuGet önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Migration'ların model ile uyumlu olduğunu doğrula
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project src/GovAI.Persistence \
            --startup-project src/GovAI.Api

  workers:
    name: Python worker lint ve testler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: pytest -q

  contracts:
    name: C# / Python sözleşme senkronu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Alan beyaz listesi ve kuyruk adları iki yığında ayrı tanımlı; derleyici
      # bunları koruyamaz, uyuşmazlık sessizce yanlış skor üretir.
      - run: python scripts/check_contract_parity.py

  web:
    name: Web derleme ve lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  docker:
    name: Docker imajları derlenebiliyor mu
    runs-on: ubuntu-latest
    needs: [backend, workers, web]
    steps:
      - uses: actions/checkout@v4

      # NOT: docker/setup-buildx-action ve docker/build-push-action bilerek
      # kullanılmıyor — backend işindeki ile aynı 429 sorununa takıldılar.
      # Runner'da Docker zaten kurulu ve bu iş yalnızca "imajlar derlenebiliyor mu"
      # sorusunu yanıtlayan bir duman testidir; kayıt defterine gönderim yapmaz.
      # Kayıt defterine gönderim eklenecekse buildx o zaman geri gelebilir.
      - name: API imajı
        run: docker build -f src/GovAI.Api/Dockerfile -t govai-api:ci .

      - name: Worker imajı
        run: docker build -t govai-worker:ci workers

      - name: Web imajı
        run: docker build -t govai-web:ci web

      - name: İmaj boyutları
        run: |
          docker images --filter "reference=govai-*:ci" --format "{{.Repository}} {{.Size}}"
