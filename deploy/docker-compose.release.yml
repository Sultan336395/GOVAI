# GOVAI yayın katmanı.
#
# KULLANIM (yayın sırasında, servis servis):
#   export GOVAI_RELEASE_TAG=<yayınlanan commit SHA'sı>
#   docker compose -p govai -f docker-compose.yml -f docker-compose.release.yml \
#     -f docker-compose.limits.yml up -d --no-deps <servis>
#
# NEDEN ETİKET DOSYAYA YAZILMIYOR: Yayın etiketi, bu dosyanın da içinde bulunduğu
# commit'in SHA'sıdır. Dosyaya sabit yazılsaydı, dosyayı değiştiren her commit
# etiketi geçersiz kılardı — kısır döngü. Etiket bu yüzden dışarıdan verilir ve
# değişkenin tanımsız kalması HATA'dır: eksik bir değişken sessizce boş etikete
# ("govai-api:") dönüşüp yanlış bir imaj çekmemelidir.
#
# NE YAPAR: `image:` verildiğinde compose `build:` bölümünü kullanmaz — sunucuda
# hiçbir şey derlenmez. İmajlar GitHub Actions'ta üretilip doğrulanmış olarak
# aktarılır.
#
# NEDEN "latest" YOK: `latest` her yeni derlemede başka bir içeriğe işaret eder.
# Geri dönüşte hangi imajın çalıştığının kesin bilinmesi gerekir; yayın kaynağı
# daima commit SHA'sıdır.
#
# VERİ SERVİSLERİ BURADA YOK: postgres, rabbitmq ve redis yayın kapsamı dışındadır.
# Yeniden başlatılmaz, yeniden oluşturulmaz, imajları çekilmez. Bu dosyada
# tanımlanmamaları bilinçlidir — yanlışlıkla kapsama girmelerini önler.

# ⚠ YAYIN ÖNCESİ ZORUNLU DENETİM
#
# Compose bir imajı bulamazsa temel dosyadaki `build:` bölümüne DÜŞER ve sunucuda
# derleme başlatır. `pull_policy: never` bunu engellemez; imajın YEREL OLARAK var
# olması gerekir. Bu tuzağa bir kez düşüldü: worker'lar `govai-worker:<sha>` adını
# ister ama yerel etiketler servis adlarıyla (`govai-collector:<sha>` …) verilmişti;
# ad bulunamayınca sunucu imajı kendisi derledi.
#
# Bu yüzden yayından ÖNCE, compose'un çözdüğü ÜÇ adın da yerelde bulunduğu
# doğrulanmalıdır — servis adları değil, aşağıdaki adlar:
#
#   docker image inspect govai-api:$GOVAI_RELEASE_TAG    >/dev/null
#   docker image inspect govai-web:$GOVAI_RELEASE_TAG    >/dev/null
#   docker image inspect govai-worker:$GOVAI_RELEASE_TAG >/dev/null
#
# Biri eksikse yayın BAŞLATILMAZ.

services:
  api:
    image: govai-api:${GOVAI_RELEASE_TAG:?GOVAI_RELEASE_TAG tanımlı olmalı}
    pull_policy: never

  web:
    image: govai-web:${GOVAI_RELEASE_TAG:?GOVAI_RELEASE_TAG tanımlı olmalı}
    pull_policy: never

  # Dört worker aynı imajı paylaşır; her biri kendi komutunu compose'dan alır.
  collector:
    image: govai-worker:${GOVAI_RELEASE_TAG:?GOVAI_RELEASE_TAG tanımlı olmalı}
    pull_policy: never

  parser:
    image: govai-worker:${GOVAI_RELEASE_TAG:?GOVAI_RELEASE_TAG tanımlı olmalı}
    pull_policy: never

  scoring:
    image: govai-worker:${GOVAI_RELEASE_TAG:?GOVAI_RELEASE_TAG tanımlı olmalı}
    pull_policy: never

  scheduler:
    image: govai-worker:${GOVAI_RELEASE_TAG:?GOVAI_RELEASE_TAG tanımlı olmalı}
    pull_policy: never
