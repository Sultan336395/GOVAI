# GOVAI yerel/staging ortamı.
#
# Kullanım:
#   cd deploy
#   cp .env.example .env       # değerleri doldurun
#   docker compose up -d --build
#
# Servisler:
#   postgres  → 5432   (veri)
#   redis     → 6379   (önbellek)
#   rabbitmq  → 5672 / 15672 (kuyruk + yönetim arayüzü)
#   api       → 8080   (.NET REST API + Swagger)
#   web       → 5180   (React panel, nginx)
#   collector / parser / scheduler / scoring → Python worker'ları

name: govai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-govai}
      POSTGRES_USER: ${POSTGRES_USER:-govai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlanmalı}
      # Türkçe karakterlerin doğru sıralanması için.
      LANG: tr_TR.utf8
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=8MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govai} -d ${POSTGRES_DB:-govai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-govai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD tanımlanmalı}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: src/GovAI.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-govai};Username=${POSTGRES_USER:-govai};Password=${POSTGRES_PASSWORD}"
      Database__AutoMigrate: "true"
      Seed__Enabled: ${SEED_ENABLED:-false}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@govai.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__WorkerEmail: ${WORKER_EMAIL:-}
      Seed__WorkerPassword: ${WORKER_PASSWORD:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY en az 32 karakter olmalı}
      Jwt__Issuer: govai
      Jwt__Audience: govai-api
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-govai}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}

      # Platform hesabı açma ucunu koruyan bootstrap sırrı.
      #
      # TANIMLI DEĞİLSE UÇ 404 DÖNER — varsayılan kurulumda açıkta hesap açma yolu
      # bulunmaz. Değer yalnızca inceleyici hesabı açılırken tanımlanır ve hesap
      # etkinleştirildikten sonra .env'den KALDIRILIR.
      GOVAI_PLATFORM_BOOTSTRAP_SECRET: ${GOVAI_PLATFORM_BOOTSTRAP_SECRET:-}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:5180}
    volumes:
      - api-logs:/app/logs
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5180}:80"

  collector:
    build:
      context: ../workers
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    command: ["govai-collector"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    environment: &worker-env
      GOVAI_API_BASE_URL: http://api:8080
      # Worker artık yönetici hesabıyla değil, sınırlı SystemIngest kimliğiyle bağlanır.
      # Parola yalnızca .env dosyasından gelir; kodda ve depoda tutulmaz.
      GOVAI_API_EMAIL: ${WORKER_EMAIL:-}
      GOVAI_API_PASSWORD: ${WORKER_PASSWORD:-}
      GOVAI_RABBITMQ_HOST: rabbitmq
      GOVAI_RABBITMQ_USER: ${RABBITMQ_USER:-govai}
      GOVAI_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GOVAI_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOVAI_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GOVAI_LOG_JSON: "true"

  parser:
    build:
      context: ../workers
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    command: ["govai-parser"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    environment: *worker-env

  # govai.scoring.requested kuyruğunun tüketicisi. Denetimde bu kuyruğun hiç tüketicisi
  # olmadığı, yani mesajların üretilip hiç işlenmediği bulunmuştu (Faz 2, madde 8).
  scoring:
    build:
      context: ../workers
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    command: ["govai-scoring"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    environment: *worker-env

  scheduler:
    build:
      context: ../workers
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    command: ["govai-scheduler"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    environment: *worker-env

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  api-logs:
