# GOVAI geri dönüş katmanı.
#
# KULLANIM (yalnızca yayın başarısız olduğunda):
#   docker compose -p govai -f docker-compose.yml -f docker-compose.rollback.yml \
#     -f docker-compose.limits.yml up -d --no-deps api web collector parser scoring scheduler
#
# SERVİS ADLARI AÇIKÇA VERİLİR: adsız `up -d` veri servislerini de kapsar ve
# postgres/redis/rabbitmq yeniden oluşturulur. Bunlar yayın kapsamı dışındadır.
#
# NE YAPAR: Derlemeyi devre dışı bırakır ve her servisi, yayından ÖNCE çalıştığı
# kanıtlanmış değişmez etikete sabitler. `image:` verildiğinde compose `build:`
# bölümünü kullanmaz; hiçbir şey yeniden derlenmez, hazır imaj olduğu gibi başlar.
#
# NEDEN DEĞİŞMEZ ETİKET: yayın öncesi tüm imajlar yalnızca `latest` etiketliydi.
# Yeniden derleme `latest`i üzerine yazar ve eski imaj isimsiz kalır — geri dönüş
# imkânsızlaşır.
#
# ── 12.09.2026 · Personel kırılımı açık beyan + zamanlayıcı saati öncesi sürüm ──
#
#   govai-api:e41f142
#   govai-web:e41f142
#   govai-worker:e41f142
#
# !! BU SÜRÜME DÖNERKEN VERİ DE GERİ ALINMALIDIR !!
#
# 94f61e0 yayını ilk kez EKLEMELİ OLMAYAN bir migration içerir:
# PersonelKirilimiAcikBeyan, personel kırılım kolonlarını nullable yapar ve
# "girilmediği için 0 duran" değerleri NULL'a çevirir. e41f142 ve öncesi bu
# kolonları `int` (null kabul etmez) olarak okur; NULL gören eski sürüm firma
# kaydını OKUYAMAZ ve hata verir.
#
# Yani yalnızca imajı geri almak YETMEZ. Önce veri eski biçime döndürülür:
#
#   docker exec govai-postgres-1 psql -U govai -d govai -c "
#     UPDATE govai.companies SET
#       women_employee_count    = COALESCE(women_employee_count, 0),
#       young_employee_count    = COALESCE(young_employee_count, 0),
#       rnd_employee_count      = COALESCE(rnd_employee_count, 0),
#       disabled_employee_count = COALESCE(disabled_employee_count, 0);"
#
# Bu UPDATE, yayın anında NULL'a çevrilen değerleri 0'a geri getirir; yayından
# SONRA girilmiş gerçek beyanlar varsa onlar korunur, yalnızca beyansız alanlar
# tekrar 0 görünür. Kolonların nullable olması eski sürümü rahatsız etmez.
#
# Sıra: önce bu UPDATE, sonra aşağıdaki compose komutu. Ters sırada eski sürüm
# açılır açılmaz firma sayfalarında hata verir.
#
# DÖRT WORKER AYNI İMAJI PAYLAŞIR. Bu dosya eskiden her worker'ı ayrı bir imaj
# adına (`govai-collector:…`, `govai-parser:…`) sabitliyordu; o adlar artık
# üretilmiyor ve geri dönüş, imaj bulunamadığı için temel dosyanın `build:`
# bölümüne düşerek SUNUCUDA DERLEME başlatırdı. Geri dönüşün kendisi arıza
# üretmemelidir.
#
# ÖNCEKİ SÜRÜMLER (artık hedef değil): 69b8e31, d517aa2, 023f6b2, eda245c, f28ca80, 14953a2, cc49454, 398f84e, cff2322, 2a5382d, 492b40c, 0d42f3f, c8bf41d, bc6a53a, 5cb1a7f, c202352, cffc2b5, 9c35582, c202352, b13f0c2, 3e9b9ab. O etiketli imajlar
# silinmedi; gerekirse bu dosyanın bir kopyasıyla hedeflenebilirler.
#
# VERİTABANI: Bu dosya veritabanına DOKUNMAZ ve otomatik restore İÇERMEZ.
#
# Faz 3 migration'larının tamamı eklemeliydi (yeni tablo, yeni nullable kolon), bu
# yüzden eski imajlar yeni şemayla sorunsuz çalışıyordu. 94f61e0 ile bu artık
# geçerli DEĞİL: yukarıdaki uyarıda anlatılan veri dönüşümü olmadan geri dönüş
# çalışmaz. Yeni bir yayın eklemeli olmayan migration içeriyorsa, geri dönüşün
# veri adımı bu dosyaya yazılmadan yayın yapılmaz.
#
# Veri bozulması görülürse doğrulanmış yedekle karşılaştırılır ve gerçek
# veritabanına geri yükleme ayrıca onay ister.

services:
  api:
    image: govai-api:e41f142
    pull_policy: never

  web:
    image: govai-web:e41f142
    pull_policy: never

  collector:
    image: govai-worker:e41f142
    pull_policy: never

  parser:
    image: govai-worker:e41f142
    pull_policy: never

  scoring:
    image: govai-worker:e41f142
    pull_policy: never

  scheduler:
    image: govai-worker:e41f142
    pull_policy: never
