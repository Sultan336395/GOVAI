# GOVAI geri dönüş katmanı.
#
# KULLANIM (yalnızca yayın başarısız olduğunda):
#   docker compose -p govai -f docker-compose.yml -f docker-compose.rollback.yml \
#     -f docker-compose.limits.yml up -d --no-deps api web collector parser scoring scheduler
#
# SERVİS ADLARI AÇIKÇA VERİLİR: adsız `up -d` veri servislerini de kapsar ve
# postgres/redis/rabbitmq yeniden oluşturulur. Bunlar yayın kapsamı dışındadır.
#
# NE YAPAR: Derlemeyi devre dışı bırakır ve her servisi, yayından ÖNCE çalıştığı
# kanıtlanmış değişmez etikete sabitler. `image:` verildiğinde compose `build:`
# bölümünü kullanmaz; hiçbir şey yeniden derlenmez, hazır imaj olduğu gibi başlar.
#
# NEDEN DEĞİŞMEZ ETİKET: yayın öncesi tüm imajlar yalnızca `latest` etiketliydi.
# Yeniden derleme `latest`i üzerine yazar ve eski imaj isimsiz kalır — geri dönüş
# imkânsızlaşır.
#
# ── 11.09.2026 · Yapay zekâ ikinci görüşü yayını öncesi çalışan sürüm ──────
#
#   govai-api:f28ca80
#   govai-web:f28ca80
#   govai-worker:f28ca80
#
# DÖRT WORKER AYNI İMAJI PAYLAŞIR. Bu dosya eskiden her worker'ı ayrı bir imaj
# adına (`govai-collector:…`, `govai-parser:…`) sabitliyordu; o adlar artık
# üretilmiyor ve geri dönüş, imaj bulunamadığı için temel dosyanın `build:`
# bölümüne düşerek SUNUCUDA DERLEME başlatırdı. Geri dönüşün kendisi arıza
# üretmemelidir.
#
# ÖNCEKİ SÜRÜMLER (artık hedef değil): 14953a2, cc49454, 398f84e, cff2322, 2a5382d, 492b40c, 0d42f3f, c8bf41d, bc6a53a, 5cb1a7f, c202352, cffc2b5, 9c35582, c202352, b13f0c2, 3e9b9ab. O etiketli imajlar
# silinmedi; gerekirse bu dosyanın bir kopyasıyla hedeflenebilirler.
#
# VERİTABANI: Bu dosya veritabanına DOKUNMAZ. Geri dönüş otomatik restore İÇERMEZ —
# Faz 3 migration'larının tamamı eklemelidir (yeni tablo ve yeni nullable kolonlar),
# bu yüzden b13f0c2 imajı yeni şemayla çalışmaya devam eder. Veri uyumsuzluğu
# görülürse doğrulanmış yedekle karşılaştırılır ve ayrıca onay istenir.

services:
  api:
    image: govai-api:f28ca80
    pull_policy: never

  web:
    image: govai-web:f28ca80
    pull_policy: never

  collector:
    image: govai-worker:f28ca80
    pull_policy: never

  parser:
    image: govai-worker:f28ca80
    pull_policy: never

  scoring:
    image: govai-worker:f28ca80
    pull_policy: never

  scheduler:
    image: govai-worker:f28ca80
    pull_policy: never
