# GOVAI geri dönüş katmanı.
#
# KULLANIM (yalnızca yayın başarısız olduğunda):
#   docker compose -p govai -f docker-compose.yml -f docker-compose.rollback.yml up -d
#
# NE YAPAR: Derlemeyi devre dışı bırakır ve her servisi, yayından ÖNCE çalıştığı
# kanıtlanmış değişmez etikete sabitler. `image:` verildiğinde compose `build:`
# bölümünü kullanmaz; hiçbir şey yeniden derlenmez, hazır imaj olduğu gibi başlar.
#
# NEDEN DEĞİŞMEZ ETİKET: yayın öncesi tüm imajlar yalnızca `latest` etiketliydi.
# Yeniden derleme `latest`i üzerine yazar ve eski imaj isimsiz kalır — geri dönüş
# imkânsızlaşır. 05.09.2026'da çalışan imajlara `3e9b9ab` etiketi verildi:
#
#   govai-api:3e9b9ab         65f56c20c633
#   govai-web:3e9b9ab         4e39c60828df
#   govai-collector:3e9b9ab   6ff445f02897
#   govai-parser:3e9b9ab      1018d5eabf92
#   govai-scoring:3e9b9ab     2347365d5b0c
#   govai-scheduler:3e9b9ab   097c29fed5d4
#
# VERİTABANI: Bu dosya veritabanına DOKUNMAZ. Geri dönüş otomatik restore İÇERMEZ —
# şema geriye uyumlu olduğu sürece eski uygulama mevcut veriyle çalışır. Veri
# uyumsuzluğu görülürse yedekle karşılaştırılır ve ayrıca onay istenir.

services:
  api:
    image: govai-api:3e9b9ab
    pull_policy: never

  web:
    image: govai-web:3e9b9ab
    pull_policy: never

  collector:
    image: govai-collector:3e9b9ab
    pull_policy: never

  parser:
    image: govai-parser:3e9b9ab
    pull_policy: never

  scoring:
    image: govai-scoring:3e9b9ab
    pull_policy: never

  scheduler:
    image: govai-scheduler:3e9b9ab
    pull_policy: never

  # postgres, rabbitmq ve redis zaten sürümü sabitlenmiş resmî imajlardır
  # (postgres:17-alpine, rabbitmq:4-management-alpine, redis:7-alpine);
  # geri dönüşte değişmezler ve burada yeniden tanımlanmalarına gerek yoktur.
