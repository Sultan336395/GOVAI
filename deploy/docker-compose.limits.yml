# GOVAI kaynak sınırları — YALNIZCA UYGULAMA SERVİSLERİ.
#
# KULLANIM (yayın sırasında, servis servis):
#   docker compose -p govai -f docker-compose.yml -f docker-compose.release.yml #     -f docker-compose.limits.yml up -d --no-deps <servis>
#
# NEDEN VERİ SERVİSLERİ BURADA YOK: Bir container'a kaynak sınırı uygulamak onu
# YENİDEN OLUŞTURMAYI gerektirir; HostConfig çalışan container'da değiştirilemez.
# PostgreSQL, RabbitMQ ve Redis bu yayında yeniden başlatılmayacak ve yeniden
# oluşturulmayacaktır. Onların sınırları ayrı bir dosyadadır
# (docker-compose.limits-data.yml) ve ayrı, açıkça onaylanmış bir bakım penceresinde
# uygulanır.
#
# ÖLÇÜM: Değerler 05.09.2026'da stg-api sunucusunda cgroup `memory.peak` okunarak
# belirlendi. Sunucuda 7,8 GB RAM ve 2 çekirdek var; 4 GB swap yayın öncesi eklendi.
# Aynı makinede 23 başka projenin container'ı çalışıyor — sınırların amacı kaçak bir
# sürecin komşuları düşürmesini önlemek, normal çalışmayı kısmak değil.
#
# PID sınırı `deploy.resources.limits.pids` altında yazılır. Üst düzey `pids_limit`
# aynı şeyin ikinci yazımıdır; ikisi birlikte verilince compose projeyi reddeder.

services:
  api:
    # Ölçülen tepe: 250 MB. .NET çöp toplayıcısı cgroup sınırını okur ve ona göre
    # davranır, bu yüzden sınır koymak burada faydalıdır — bellek baskısında GC daha
    # erken devreye girer.
    deploy:
      resources:
        limits: { memory: 768M, cpus: "0.75", pids: 200 }
        reservations: { memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    # Ölçülen tepe: 18 MB (nginx, statik dosyalar).
    deploy:
      resources:
        limits: { memory: 96M, cpus: "0.25", pids: 50 }
        reservations: { memory: 16M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Python worker'ları ──
  # Ölçülen tepeler: collector 41 MB, parser 38 MB, scheduler 34 MB, scoring 33 MB.
  # Ayrıştırma sırasında büyük PDF'ler belleğe alınır; sınır buna yer bırakır.

  collector:
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.25", pids: 50 }
        reservations: { memory: 48M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  parser:
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.25", pids: 50 }
        reservations: { memory: 48M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  scoring:
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.25", pids: 50 }
        reservations: { memory: 48M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  scheduler:
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.25", pids: 50 }
        reservations: { memory: 48M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
